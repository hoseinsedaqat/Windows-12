name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Serve build
        run: |
          nohup npm run preview -- --host 0.0.0.0 --port 4173 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/ > /dev/null; then echo "preview up"; break; fi
            sleep 1
          done

      - name: Drive the UI and take screenshots
        run: node scripts/screenshot.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/raw/*.png
          retention-days: 7
