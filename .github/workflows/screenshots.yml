name: Screenshots

on:
  workflow_dispatch:
    inputs:
      update_refs:
        description: 'Accept the current screenshots as the new reference baseline'
        type: boolean
        default: false
  push:
    branches: ['arena/**']
    paths:
      - 'scripts/screenshot.mjs'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Serve build
        run: |
          nohup npm run preview > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/ > /dev/null; then echo "preview up"; break; fi
            sleep 1
          done

      - name: Drive the UI and take screenshots
        run: node scripts/screenshot.mjs 2>&1 | tee /tmp/shoot.log

      - name: Visual regression diff vs refs
        if: github.event.inputs.update_refs != 'true'
        id: vdiff
        continue-on-error: true
        run: node scripts/visual_diff.mjs 2>&1 | tee docs/screenshots/diff-report.txt

      - name: Update reference baseline (requested)
        if: github.event.inputs.update_refs == 'true'
        run: node scripts/visual_diff.mjs --update

      - name: Commit screenshots (or diagnostics) back to the branch
        if: always()
        run: |
          cp /tmp/preview.log /tmp/shoot.log docs/screenshots/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore(screenshots): refresh product shots from CI run ${{ github.run_id }}"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Fail the job when screenshots drifted
        if: steps.vdiff.outcome == 'failure'
        run: |
          echo "Visual regression detected. Diff images and the report were committed above (docs/screenshots/diff/)."
          exit 1
